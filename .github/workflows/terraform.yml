
name: "Terraform CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform Action"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-2" # Update with your cloud provider config

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    #- name: Debug OIDC
    #  run: |
    #    echo "Repository: $GITHUB_REPOSITORY"
    #    echo "Ref: $GITHUB_REF"
    #    echo "Workflow: $GITHUB_WORKFLOW"

    #- name: Get OIDC Token
    #  env:
    #    ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
    #    ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
    #  run: |
    #    TOKEN=$(curl -sSf \
    #      -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
    #      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
    #      | jq -r '.value')
    #
    #    echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::527557824388:role/GitubActions-S3_role
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS Identity
      run: aws sts get-caller-identity

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.6" # Pin your specific version

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Checks all provider versions
    - name: Terraform Providers
      run: terraform providers

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

    - name: Get ECR repository name
      id: ecr
      run: echo "repository=$(terraform output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ steps.ecr.outputs.repository }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
